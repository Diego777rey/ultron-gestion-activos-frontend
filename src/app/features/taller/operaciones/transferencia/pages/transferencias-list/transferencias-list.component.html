<app-generic-list
  [columns]="columns"
  [data]="transferencias()"
  [loading]="loading()"
  [error]="error()"
  [total]="totalElements()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [pageSizeOptions]="[15, 25, 50, 100]"
  [searchValue]="search()"
  (searchValueChange)="search.set($event)"
  [toolbarActions]="toolbarActions"
  emptyMessage="No hay transferencias registradas"
  [trackBy]="trackById"
  (pageChange)="onPageChange($event)"
  (retry)="load()"
  (actionClicked)="onToolbarAction($event)"
  (searchSubmit)="pageIndex.set(0); load()"
>
  <div genericListFilters class="trf-filters">
    <div class="filter-field filter-field--id">
      <label for="trf-search">Buscar por ID o número</label>
      <input
        id="trf-search"
        type="text"
        [value]="search()"
        (input)="search.set($any($event.target).value)"
        (keydown.enter)="pageIndex.set(0); load()"
      />
    </div>

    <app-entity-searcher
      class="filter-field--sector"
      [items]="sectoresForSearcher()"
      [value]="selectedOrigen()?.id_sector ?? null"
      (itemChange)="onOrigenSelected($event)"
      [displayFn]="sectorLabelFn"
      [keyFn]="sectorKeyFn"
      [columns]="sectorColumns"
      [backendPagination]="true"
      [totalItems]="sectoresTotal()"
      [pageIndex]="sectoresPage()"
      [pageSize]="sectoresPageSize()"
      [loading]="loadingSectores()"
      (searchChange)="onSectorSearchChange($event)"
      (pageChange)="onSectorPageChange($event)"
      label="Sector origen"
      searchPlaceholder="Buscar sector origen..."
    />

    <app-entity-searcher
      class="filter-field--sector"
      [items]="sectoresForSearcher()"
      [value]="selectedDestino()?.id_sector ?? null"
      (itemChange)="onDestinoSelected($event)"
      [displayFn]="sectorLabelFn"
      [keyFn]="sectorKeyFn"
      [columns]="sectorColumns"
      [backendPagination]="true"
      [totalItems]="sectoresTotal()"
      [pageIndex]="sectoresPage()"
      [pageSize]="sectoresPageSize()"
      [loading]="loadingSectores()"
      (searchChange)="onSectorSearchChange($event)"
      (pageChange)="onSectorPageChange($event)"
      label="Sector destino"
      searchPlaceholder="Buscar sector destino..."
    />

    <app-date-range-picker
      class="filter-field--dates"
      label="Rango de fecha"
      [value]="dateRange()"
      (valueChange)="dateRange.set($event)"
      (closed)="onDateRangeChange($event)"
    />
  </div>

  <ng-template appTableCell="id" [appTableCellFrom]="transferencias()" let-item>
    {{ item.id_transferencia }}
  </ng-template>

  <ng-template appTableCell="numero" [appTableCellFrom]="transferencias()" let-item>
    <button type="button" class="link-btn" (click)="openGestion(item)">
      {{ item.numero | defaultEmpty }}
    </button>
  </ng-template>

  <ng-template appTableCell="fecha" [appTableCellFrom]="transferencias()" let-item>
    {{ item.fecha | defaultEmpty }}
  </ng-template>

  <ng-template appTableCell="sectorOrigen" [appTableCellFrom]="transferencias()" let-item>
    {{ item.sectorOrigen?.nombre | defaultEmpty }}
  </ng-template>

  <ng-template appTableCell="sectorDestino" [appTableCellFrom]="transferencias()" let-item>
    {{ item.sectorDestino?.nombre | defaultEmpty }}
  </ng-template>

  <ng-template appTableCell="cantidadItems" [appTableCellFrom]="transferencias()" let-item>
    {{ item.cantidadItems ?? item.detalles?.length ?? 0 }}
  </ng-template>

  <ng-template appTableCell="estado" [appTableCellFrom]="transferencias()" let-item>
    <span
      class="estado-pill"
      [class.estado-pill--creacion]="item.estado === 'CREACION' || item.estado === 'PENDIENTE'"
      [class.estado-pill--pendiente]="item.estado === 'PENDIENTE_CONFERIR'"
      [class.estado-pill--conferido]="item.estado === 'CONFERIDO'"
      [class.estado-pill--recepcionado]="item.estado === 'RECEPCIONADO'"
    >
      {{ estadoLabel(item.estado) | defaultEmpty }}
    </span>
  </ng-template>

  <ng-template appTableCell="acciones" [appTableCellFrom]="transferencias()" let-item>
    <app-action-menu [actions]="rowActionsFor(item)" (actionSelected)="onRowAction($event, item)" />
  </ng-template>
</app-generic-list>
