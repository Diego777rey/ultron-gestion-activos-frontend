<app-generic-list
  [columns]="columns"
  [data]="cotizaciones()"
  [loading]="loading()"
  [error]="error()"
  [total]="totalElements()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [pageSizeOptions]="[15, 25, 50]"
  [searchLabel]="'Buscar por moneda'"
  [searchValue]="search()"
  [toolbarActions]="toolbarActions"
  [emptyMessage]="'No hay cotizaciones registradas'"
  [trackBy]="trackById"
  (searchValueChange)="search.set($event)"
  (actionClicked)="onToolbarAction($event)"
  (pageChange)="onPageChange($event)"
  (retry)="load()"
>
  <ng-container appTableCell="moneda" let-item>
    {{ monedaLabel(item.moneda) }}
  </ng-container>

  <ng-container appTableCell="valor" let-item>
    {{ item.valor | number: '1.2-2' }}
  </ng-container>

  <ng-container appTableCell="fechaActualizacion" let-item>
    {{ item.fechaActualizacion | date: 'dd/MM/yyyy HH:mm' }}
  </ng-container>

  <ng-container appTableCell="activa" let-item>
    <span [class.badge-active]="item.activa" [class.badge-inactive]="!item.activa">
      {{ item.activa ? 'Sí' : 'No' }}
    </span>
  </ng-container>

  <ng-container appTableCell="acciones" let-item>
    <app-action-menu [actions]="rowActions" (actionSelected)="onRowAction($event, item)" />
  </ng-container>
</app-generic-list>
