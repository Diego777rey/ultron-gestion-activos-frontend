<app-notify-error [message]="error()" />

<form class="entity-form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="field">
    <input id="nombre" class="field__input" type="text" formControlName="nombre" placeholder=" " />
    <label class="field__label" for="nombre">Nombre de la terminal*</label>
    @if (form.controls.nombre.touched && form.controls.nombre.invalid) {
      <span class="field__error">El nombre es obligatorio</span>
    }
  </div>

  <div class="field field--checkbox">
    <label class="checkbox-label">
      <input type="checkbox" formControlName="activa" />
      Activa
    </label>
  </div>
</form>

<div class="footer">
  <app-ui-button
    label="Guardar"
    icon="save"
    variant="primary"
    [loading]="saving()"
    (clicked)="onSubmit()"
  />
</div>
