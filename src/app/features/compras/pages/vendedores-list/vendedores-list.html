<app-generic-list
  [columns]="columns"
  [data]="visibles()"
  [loading]="loading()"
  [error]="error()"
  [total]="total()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [pageSizeOptions]="[15, 25, 50, 100]"
  searchLabel="Nombre, proveedor, cargo o teléfono"
  [searchValue]="search()"
  (searchValueChange)="onSearchChange($event)"
  [toolbarActions]="toolbarActions"
  emptyMessage="No hay vendedores que coincidan con la búsqueda"
  [trackBy]="trackById"
  (pageChange)="onPageChange($event)"
  (retry)="load()"
  (actionClicked)="onToolbarAction($event)"
  (searchSubmit)="pageIndex.set(0)"
>
  <ng-template appTableCell="id" [appTableCellFrom]="visibles()" let-vendedor>
    {{ vendedor.id_vendedor }}
  </ng-template>

  <ng-template appTableCell="nombre" [appTableCellFrom]="visibles()" let-vendedor>
    {{ nombre(vendedor) }}
  </ng-template>

  <ng-template appTableCell="proveedor" [appTableCellFrom]="visibles()" let-vendedor>
    {{ vendedor.proveedor_nombre | defaultEmpty }}
  </ng-template>

  <ng-template appTableCell="cargo" [appTableCellFrom]="visibles()" let-vendedor>
    {{ vendedor.cargo | defaultEmpty }}
  </ng-template>

  <ng-template appTableCell="telefono" [appTableCellFrom]="visibles()" let-vendedor>
    {{ contacto(vendedor) | defaultEmpty }}
  </ng-template>

  <ng-template appTableCell="email" [appTableCellFrom]="visibles()" let-vendedor>
    {{ vendedor.email | defaultEmpty }}
  </ng-template>

  <ng-template appTableCell="estado" [appTableCellFrom]="visibles()" let-vendedor>
    {{ estado(vendedor.activo) }}
  </ng-template>

  <ng-template appTableCell="acciones" [appTableCellFrom]="visibles()" let-vendedor>
    <app-action-menu [actions]="rowActions" (actionSelected)="onRowAction($event, vendedor)" />
  </ng-template>
</app-generic-list>
