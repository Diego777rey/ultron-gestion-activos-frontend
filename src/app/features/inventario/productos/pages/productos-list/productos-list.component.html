<app-generic-list
  [columns]="columns"
  [data]="productos()"
  [loading]="loading()"
  [error]="error()"
  [total]="totalElements()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [pageSizeOptions]="[15, 25, 50, 100]"
  searchLabel="Buscar por nombre o código de barras..."
  [searchValue]="search()"
  (searchValueChange)="search.set($event)"
  [toolbarActions]="toolbarActions"
  emptyMessage="No hay productos que coincidan con la búsqueda"
  [trackBy]="trackById"
  (pageChange)="onPageChange($event)"
  (retry)="load()"
  (actionClicked)="onToolbarAction($event)"
  (searchSubmit)="pageIndex.set(0); load()"
>
  <ng-template appTableCell="codigoBarras" [appTableCellFrom]="productos()" let-producto>
    @if (producto.codigoBarras || producto.codigo) {
      <span class="cell-barcode">
        <span class="material-icons" aria-hidden="true">qr_code_2</span>
        {{ producto.codigoBarras || producto.codigo }}
      </span>
    } @else {
      <span class="cell-muted">—</span>
    }
  </ng-template>

  <ng-template appTableCell="nombre" [appTableCellFrom]="productos()" let-producto>
    <span class="cell-name">{{ producto.nombre | defaultEmpty }}</span>
  </ng-template>

  <ng-template appTableCell="precioVenta" [appTableCellFrom]="productos()" let-producto>
    <span class="cell-price">{{ producto.precioVenta | number:'1.0-0' | defaultEmpty }}</span>
  </ng-template>

  <ng-template appTableCell="categoria" [appTableCellFrom]="productos()" let-producto>
    <span class="cell-category">{{ categoriaLabel(producto) | defaultEmpty }}</span>
  </ng-template>

  <ng-template appTableCell="acciones" [appTableCellFrom]="productos()" let-producto>
    <app-action-menu [actions]="rowActions" (actionSelected)="onRowAction($event, producto)" />
  </ng-template>
</app-generic-list>
