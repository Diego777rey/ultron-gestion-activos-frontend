<app-generic-list
  [columns]="columns"
  [data]="sesiones()"
  [loading]="loading()"
  [error]="error()"
  [total]="totalElements()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [pageSizeOptions]="[15, 25, 50, 100]"
  [toolbarActions]="toolbarActions"
  emptyMessage="No cerraste ninguna caja en el rango de fechas"
  [trackBy]="trackById"
  (pageChange)="onPageChange($event)"
  (retry)="load()"
  (actionClicked)="onToolbarAction($event)"
>
  <div genericListFilters>
    <app-date-range-picker
      label="Fecha de cierre"
      [value]="dateRange()"
      (valueChange)="dateRange.set($event)"
      (closed)="onDateRangeChange($event)"
    />
  </div>
  <ng-template appTableCell="id_sesion_caja" [appTableCellFrom]="sesiones()" let-item>
    {{ item.id_sesion_caja }}
  </ng-template>

  <ng-template appTableCell="caja" [appTableCellFrom]="sesiones()" let-item>
    {{ item.caja?.nombre | defaultEmpty }}
  </ng-template>

  <ng-template appTableCell="maletin" [appTableCellFrom]="sesiones()" let-item>
    {{ item.maletin?.nombre | defaultEmpty }}
  </ng-template>

  <ng-template appTableCell="fechaApertura" [appTableCellFrom]="sesiones()" let-item>
    {{ item.fechaApertura | date: 'dd/MM/yyyy HH:mm' | defaultEmpty }}
  </ng-template>

  <ng-template appTableCell="fechaCierre" [appTableCellFrom]="sesiones()" let-item>
    {{ item.fechaCierre | date: 'dd/MM/yyyy HH:mm' | defaultEmpty }}
  </ng-template>

  <ng-template appTableCell="totalVentasPyg" [appTableCellFrom]="sesiones()" let-item>
    Gs. {{ (item.totalVentasPyg ?? 0) | number: '1.0-0' }}
  </ng-template>

  <ng-template appTableCell="reimprimir" [appTableCellFrom]="sesiones()" let-item>
    <app-ui-button
      label="Reimprimir cierre"
      icon="print"
      variant="outline"
      size="sm"
      [loading]="imprimiendoId() === item.id_sesion_caja"
      [disabled]="imprimiendoId() != null && imprimiendoId() !== item.id_sesion_caja"
      (clicked)="reimprimir(item)"
    />
  </ng-template>
</app-generic-list>
