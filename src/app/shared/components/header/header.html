<div class="header-left">
  <button class="header-icon-btn toggle-btn" (click)="onMenuClick()" aria-label="Toggle Sidebar Menu">
    <span class="material-icons">menu</span>
  </button>
  <span class="app-version" title="Versión instalada">v{{ version }}</span>
  <button
    type="button"
    class="conexion-indicador"
    [class.conexion-en-linea]="estadoConexion() === 'en-linea'"
    [class.conexion-sin-red]="estadoConexion() === 'sin-red'"
    [class.conexion-sin-servidor]="estadoConexion() === 'sin-servidor'"
    [class.conexion-comprobando]="estadoConexion() === 'comprobando'"
    [attr.title]="detalleConexion()"
    [attr.aria-label]="detalleConexion()"
    (click)="comprobarConexion()"
  >
    <span class="conexion-dot" aria-hidden="true"></span>
    <span class="conexion-label" aria-live="polite">{{ etiquetaConexion() }}</span>
  </button>
</div>

<div class="header-spacer"></div>

<div class="header-right">
  @if (zoomDisponible) {
    <div class="header-zoom" role="group" aria-label="Zoom de la pantalla">
      <button type="button" class="header-zoom__btn" (click)="alejar()" aria-label="Alejar" title="Alejar (Ctrl −)">−</button>
      <button type="button" class="header-zoom__valor" (click)="restablecerZoom()" title="Tamaño real (Ctrl 0)">{{ zoomPorcentaje() }}%</button>
      <button type="button" class="header-zoom__btn" (click)="acercar()" aria-label="Acercar" title="Acercar (Ctrl +)">+</button>
    </div>
  }
  <button class="header-icon-btn notification-btn" aria-label="View Notifications">
    <span class="material-icons">notifications</span>
    <span class="notification-badge">3</span>
  </button>
  
  <div class="header-user-profile">
    <div class="user-info">
      <span class="user-name">Admin</span>
      <span class="user-role">Administrator</span>
    </div>
    <div class="user-avatar">
      <span class="material-icons">person</span>
    </div>
  </div>
</div>
