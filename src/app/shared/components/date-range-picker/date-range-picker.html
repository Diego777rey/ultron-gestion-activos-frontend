<mat-form-field appearance="fill" subscriptSizing="dynamic">
  <mat-label>{{ label() }}</mat-label>
  <mat-date-range-input [rangePicker]="picker" [formGroup]="range" [disabled]="disabled()">
    <input matStartDate formControlName="start" [placeholder]="startPlaceholder()" />
    <input matEndDate formControlName="end" [placeholder]="endPlaceholder()" />
  </mat-date-range-input>
  <mat-datepicker-toggle matIconSuffix [for]="picker" [disabled]="disabled()" />
  <mat-date-range-picker #picker panelClass="app-date-range-picker-panel" (closed)="onClosed()" />
</mat-form-field>
